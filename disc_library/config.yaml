name: "Disc Library"
version: "0.5.0"
slug: "disc_library"
description: "Browse and play your physical album collection across Sony disc changers."
url: "https://github.com/drone-01/HA-CD-Changer"
arch:
  - aarch64
  - amd64
init: true
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:album"
panel_title: "Disc Library"
homeassistant_api: true
options:
  changers:
    - name: "Changer 1"
      driver: "simulated"
    - name: "Changer 2"
      driver: "simulated"
  listen_script: ""
  sim_track_seconds: 30
  log_level: "info"
schema:
  changers:
    - name: str
      driver: "list(simulated|cx7000es)"
      host: "str?"
      port: "port?"
  listen_script: "str?"
  sim_track_seconds: "int(5,600)"
  log_level: "list(debug|info|warning|error)"
